version: 2

multi-ecosystem-groups:
  actions-and-docs:
    schedule:
      interval: "monthly"
    labels:
      - "area: dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "area: dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "actions-and-docs"

  - package-ecosystem: "npm"
    directory: "/docs"
    patterns:
      - "*"
    multi-ecosystem-group: "actions-and-docs"
