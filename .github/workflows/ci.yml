name: CI

on:
    push:
        branches: [main]
        paths-ignore:
            - "docs/**"
    pull_request:
        paths-ignore:
            - "docs/**"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        name: Check (vet + lint + test + race + build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes
                      extra-substituters = https://nix.stubbe.dev/c/default/default
                      extra-trusted-public-keys = default:6uWvXutL9cXjV3lii+Ur5ff+ArQoG4kMBKNXWrIxhHg=

            - name: just check
              run: nix develop --accept-flake-config -c just check

            - name: nix flake check
              run: nix flake check -L --accept-flake-config

    package:
        name: Package
        uses: ./.github/workflows/package.yml
        with:
            version: 0~git${{ github.sha }}
