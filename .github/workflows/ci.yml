name: CI

on:
    schedule:
        - cron: "17 3 * * 0"
    push:
        branches: [main]
        paths-ignore:
            - "docs/**"
    pull_request:
        paths-ignore:
            - "docs/**"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        name: Check (vet + lint + test + race + build)
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-latest, ubuntu-24.04-arm]
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: stubbedev/lys-ci/.github/actions/nix-setup@bf3da3ebd3253f33f2f7696b4284986772da635f
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
            - name: just check
              run: nix develop --accept-flake-config -c just check

            - name: nix flake check
              if: runner.arch == 'X64'
              run: nix flake check -L --accept-flake-config

            - name: Nix package without the VM checks, which need KVM
              if: runner.arch == 'ARM64'
              run: nix build -L --accept-flake-config .

    package:
        name: Package
        uses: ./.github/workflows/package.yml
        with:
            version: 0~git${{ github.sha }}
