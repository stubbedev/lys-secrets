name: Release

on:
    push:
        tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
    contents: read

jobs:
    version:
        name: Version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - id: version
              env:
                  TAG: ${{ github.ref_name }}
              run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

    package:
        name: Package
        needs: version
        uses: ./.github/workflows/package.yml
        with:
            version: ${{ needs.version.outputs.version }}

    publish:
        name: Publish the release
        needs: package
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: release
                  merge-multiple: true

            - name: Checksums
              working-directory: release
              run: sha256sum -- *.tar.gz *.deb *.rpm > SHA256SUMS

            - name: Create the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
              working-directory: release
              run: gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes -- *.tar.gz *.deb *.rpm SHA256SUMS
