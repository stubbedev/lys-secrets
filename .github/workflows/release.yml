name: Release

on:
    push:
        tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
    contents: read

jobs:
    version:
        name: Version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - id: version
              env:
                  TAG: ${{ github.ref_name }}
              run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

    package:
        name: Package
        needs: version
        uses: ./.github/workflows/package.yml
        with:
            version: ${{ needs.version.outputs.version }}

    publish:
        needs: package
        name: Publish the release
        permissions:
            contents: write
        uses: stubbedev/lys-ci/.github/workflows/publish-release.yml@493dadd91d1312838dcb75a2d9a6012920a3be88
